naftiko: 1.0.0-alpha2
info:
  label: Microsoft Graph Visio API — Documents
  description: 'Microsoft Graph Visio API — Documents. 1 operations. Lead operation: Microsoft Visio Get Document. Self-contained
    Naftiko capability covering one Microsoft Visio business surface.'
  tags:
  - Microsoft Visio
  - Documents
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_VISIO_API_KEY: MICROSOFT_VISIO_API_KEY
capability:
  consumes:
  - type: http
    namespace: graph-documents
    baseUri: https://graph.microsoft.com/v1.0
    description: Microsoft Graph Visio API — Documents business capability. Self-contained, no shared references.
    resources:
    - name: me-drive-items-item-id-workbook
      path: /me/drive/items/{item-id}/workbook
      operations:
      - name: getvisiodocument
        method: GET
        description: Microsoft Visio Get Document
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: item-id
          in: path
          type: string
          description: The ID of the Visio file in OneDrive.
          required: true
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_VISIO_API_KEY}}'
  exposes:
  - type: rest
    namespace: graph-documents-rest
    port: 8080
    description: REST adapter for Microsoft Graph Visio API — Documents. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/me/drive/items/{item-id}/workbook
      name: me-drive-items-item-id-workbook
      description: REST surface for me-drive-items-item-id-workbook.
      operations:
      - method: GET
        name: getvisiodocument
        description: Microsoft Visio Get Document
        call: graph-documents.getvisiodocument
        with:
          item-id: rest.item-id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: graph-documents-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Graph Visio API — Documents. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: microsoft-visio-get-document
      description: Microsoft Visio Get Document
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: graph-documents.getvisiodocument
      with:
        item-id: tools.item-id
      outputParameters:
      - type: object
        mapping: $.
