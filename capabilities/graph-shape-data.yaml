naftiko: 1.0.0-alpha2
info:
  label: Microsoft Graph Visio API — Shape Data
  description: 'Microsoft Graph Visio API — Shape Data. 1 operations. Lead operation: Microsoft Visio List Shape Data Items.
    Self-contained Naftiko capability covering one Microsoft Visio business surface.'
  tags:
  - Microsoft Visio
  - Shape Data
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_VISIO_API_KEY: MICROSOFT_VISIO_API_KEY
capability:
  consumes:
  - type: http
    namespace: graph-shape-data
    baseUri: https://graph.microsoft.com/v1.0
    description: Microsoft Graph Visio API — Shape Data business capability. Self-contained, no shared references.
    resources:
    - name: me-drive-items-item-id-workbook-pages-page-id-shapes-shape-id-shapeDataItems
      path: /me/drive/items/{item-id}/workbook/pages/{page-id}/shapes/{shape-id}/shapeDataItems
      operations:
      - name: listshapedataitems
        method: GET
        description: Microsoft Visio List Shape Data Items
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: item-id
          in: path
          type: string
          description: The ID of the Visio file.
          required: true
        - name: page-id
          in: path
          type: string
          description: The ID of the page.
          required: true
        - name: shape-id
          in: path
          type: string
          description: The ID of the shape.
          required: true
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_VISIO_API_KEY}}'
  exposes:
  - type: rest
    namespace: graph-shape-data-rest
    port: 8080
    description: REST adapter for Microsoft Graph Visio API — Shape Data. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/me/drive/items/{item-id}/workbook/pages/{page-id}/shapes/{shape-id}/shapedataitems
      name: me-drive-items-item-id-workbook-pages-page-id-shapes-shape-id-shapedataitems
      description: REST surface for me-drive-items-item-id-workbook-pages-page-id-shapes-shape-id-shapeDataItems.
      operations:
      - method: GET
        name: listshapedataitems
        description: Microsoft Visio List Shape Data Items
        call: graph-shape-data.listshapedataitems
        with:
          item-id: rest.item-id
          page-id: rest.page-id
          shape-id: rest.shape-id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: graph-shape-data-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Graph Visio API — Shape Data. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: microsoft-visio-list-shape-data
      description: Microsoft Visio List Shape Data Items
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: graph-shape-data.listshapedataitems
      with:
        item-id: tools.item-id
        page-id: tools.page-id
        shape-id: tools.shape-id
      outputParameters:
      - type: object
        mapping: $.
