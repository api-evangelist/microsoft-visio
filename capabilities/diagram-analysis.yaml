naftiko: 1.0.0-alpha2
info:
  label: Microsoft Visio Diagram Analysis
  description: Workflow capability for analyzing Visio diagrams including reading pages, shapes, data items, comments, and
    hyperlinks. Used by business analysts and IT architects to programmatically inspect diagram content.
  tags:
  - Microsoft Visio
  - Diagram Analysis
  - Visualization
  created: '2026-04-18'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    MICROSOFT_GRAPH_TOKEN: MICROSOFT_GRAPH_TOKEN
capability:
  consumes:
  - type: http
    namespace: visio-graph
    baseUri: https://graph.microsoft.com/v1.0
    description: Microsoft Graph Visio API for diagram operations.
    authentication:
      type: bearer
      token: '{{MICROSOFT_GRAPH_TOKEN}}'
    resources:
    - name: pages
      path: /me/drive/items/{item-id}/workbook/pages
      description: Visio page operations.
      operations:
      - name: list-pages
        method: GET
        description: List pages in a Visio document.
        inputParameters:
        - name: item-id
          in: path
          type: string
          required: true
          description: The ID of the Visio file.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: shapes
      path: /me/drive/items/{item-id}/workbook/pages/{page-id}/shapes
      description: Shape operations.
      operations:
      - name: list-shapes
        method: GET
        description: List shapes on a page.
        inputParameters:
        - name: item-id
          in: path
          type: string
          required: true
          description: The ID of the Visio file.
        - name: page-id
          in: path
          type: string
          required: true
          description: The ID of the page.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-shape
        method: GET
        description: Get a specific shape.
        inputParameters:
        - name: item-id
          in: path
          type: string
          required: true
          description: The ID of the Visio file.
        - name: page-id
          in: path
          type: string
          required: true
          description: The ID of the page.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: shape-data
      path: /me/drive/items/{item-id}/workbook/pages/{page-id}/shapes/{shape-id}/shapeDataItems
      description: Shape data item operations.
      operations:
      - name: list-shape-data-items
        method: GET
        description: List data items for a shape.
        inputParameters:
        - name: item-id
          in: path
          type: string
          required: true
          description: The ID of the Visio file.
        - name: page-id
          in: path
          type: string
          required: true
          description: The ID of the page.
        - name: shape-id
          in: path
          type: string
          required: true
          description: The ID of the shape.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: diagram-analysis-api
    description: Unified REST API for Visio diagram analysis.
    resources:
    - path: /v1/pages
      name: pages
      description: Diagram page operations.
      operations:
      - method: GET
        name: list-pages
        description: List all pages.
        call: visio-graph.list-pages
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/shapes
      name: shapes
      description: Shape operations.
      operations:
      - method: GET
        name: list-shapes
        description: List shapes on a page.
        call: visio-graph.list-shapes
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/shape-data
      name: shape-data
      description: Shape data operations.
      operations:
      - method: GET
        name: list-shape-data-items
        description: List data items for a shape.
        call: visio-graph.list-shape-data-items
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: diagram-analysis-mcp
    transport: http
    description: MCP server for AI-assisted Visio diagram analysis.
    tools:
    - name: list-pages
      description: List all pages in a Visio diagram.
      hints:
        readOnly: true
        openWorld: true
      call: visio-graph.list-pages
      outputParameters:
      - type: object
        mapping: $.
    - name: list-shapes
      description: List all shapes on a diagram page.
      hints:
        readOnly: true
        openWorld: true
      call: visio-graph.list-shapes
      outputParameters:
      - type: object
        mapping: $.
    - name: get-shape
      description: Get details of a specific shape.
      hints:
        readOnly: true
      call: visio-graph.get-shape
      outputParameters:
      - type: object
        mapping: $.
    - name: list-shape-data-items
      description: List data items attached to a shape.
      hints:
        readOnly: true
        openWorld: true
      call: visio-graph.list-shape-data-items
      outputParameters:
      - type: object
        mapping: $.
